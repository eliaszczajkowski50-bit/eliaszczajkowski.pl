name: Optimize profile portrait
on:
  push:
    paths:
      - '.github/workflows/optimize-portrait.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimizer
        run: python -m pip install --quiet Pillow
      - name: Generate high-quality responsive WebP images from the original PNG
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          folder = Path('assets')
          originals = sorted(folder.glob('Profesjonalny*.png'))
          if not originals:
              raise SystemExit('High-quality original portrait PNG was not found')
          original = Image.open(originals[0]).convert('RGB')
          for width in (480, 960):
              height = round(original.height * width / original.width)
              resized = original.resize((width, height), Image.Resampling.LANCZOS)
              out = folder / f'eliasz-portret-{width}.webp'
              resized.save(out, format='WEBP', quality=88, method=6)
              print(f'{out}: {out.stat().st_size} bytes')
          PY
      - name: Commit responsive images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/eliasz-portret-480.webp assets/eliasz-portret-960.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized high-resolution responsive portrait WebP"
            git push
          fi
